service:
  host: 127.0.0.1
  port: 18081
  max_concurrency: 1
  queue_timeout: 5

model:
  # 相对路径统一以 Kronos 仓库根目录解析，Windows/Linux 均可直接使用。
  tokenizer: model/pretrained/Kronos-Tokenizer-base
  predictor: model/pretrained/Kronos-base
  device: cpu
  max_context: 512

inference:
  # 生产选项为 1/3/5/10/15/30 日；长 horizon 必须分别做准确率评测。
  # 若启用现有 C1，C1 自身仍按训练时的 lookback=90、horizon=5 解释。
  lookback: 256
  max_pred_days: 30
  evaluation_horizons: [1, 3, 5, 10, 15, 30]
  sample_count: 1
  # 多路径分块可保持总采样数语义，同时限制 CPU Transformer 的峰值内存。
  sample_batch_size: 5
  temperature: 1.0
  # top_k=1 为贪心生成，可复现，适合服务缓存；研究随机路径时再改为 0/0.9。
  top_k: 1
  top_p: 1.0
  clip: 5.0

c1:
  enabled: false
  bundle: runs/dataC_c1
  features_csv: DataSet/dataC/fusion_all.csv
  min_test_ic: 0.0
  max_feature_age_days: 7
  allow_unvalidated: false